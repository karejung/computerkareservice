name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # so a failed deploy can be retried without an empty commit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it: a half-uploaded artifact would
# leave the live site mid-swap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # Pages serves this repo under /<name>/, and setting this is also what
          # switches next.config into `output: 'export'`.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Pages runs Jekyll over the upload unless told not to, and Jekyll drops
      # every folder starting with an underscore — which is all of Next's
      # `_next/` output.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
